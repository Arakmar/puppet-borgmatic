---
# Modelled on the Vox Pupuli reusable workflow
# (https://github.com/voxpupuli/gha-puppet, basic.yml). It is inlined rather
# than reused because gha-puppet installs the bundle without the development
# group, which is where the PDK Gemfile keeps every test dependency.

name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: system_tests:release_prep

jobs:
  setup_matrix:
    name: Static validations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      puppet_unit_test_matrix: ${{ steps.get-outputs.outputs.puppet_unit_test_matrix }}
    env:
      PUPPET_GEM_VERSION: '>= 8.0'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Display Ruby environment
        run: bundle env
      - name: Run static validations
        run: bundle exec rake validate lint check
      - name: Run RuboCop
        run: bundle exec rake rubocop
      - name: Check that REFERENCE.md is up to date
        run: bundle exec rake strings:validate:reference
      - name: Setup test matrix
        id: get-outputs
        run: bundle exec metadata2gha

  unit:
    name: Puppet ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }})
    needs: setup_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup_matrix.outputs.puppet_unit_test_matrix) }}
    env:
      PUPPET_GEM_VERSION: '~> ${{ matrix.puppet }}.0'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Display Ruby environment
        run: bundle env
      - name: Run unit tests
        run: bundle exec rake parallel_spec

  borgmatic:
    name: borgmatic ${{ matrix.borgmatic }}
    needs: setup_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # EPEL 9, Debian 13 and the latest release
        borgmatic:
          - '1.8.13'
          - '1.9.14'
          - latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
      BORGMATIC_VALIDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install borgmatic
        run: pipx install "borgmatic${{ matrix.borgmatic != 'latest' && format('=={0}', matrix.borgmatic) || '' }}"
      - name: Display borgmatic version
        run: borgmatic --version
      - name: Validate the rendered configurations with borgmatic
        run: |
          bundle exec rake spec_prep
          bundle exec rspec spec/defines/config_spec.rb --example 'validated by borgmatic'

  tests:
    name: Test suite
    if: always()
    needs:
      - unit
      - borgmatic
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
