---
# The static validations and the unit tests come from the Vox Pupuli
# reusable workflow (https://github.com/voxpupuli/gha-puppet, basic.yml):
# rake validate (syntax, metadata, REFERENCE.md freshness), lint and check,
# RuboCop, then the unit tests on every OpenVox major version of
# metadata.json, each with the Ruby its packages ship. The borgmatic job
# checks the rendered configuration files with borgmatic itself.
#
# release.yml calls it before publishing a tag.

name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puppet:
    name: Puppet
    uses: voxpupuli/gha-puppet/.github/workflows/basic.yml@v4

  borgmatic:
    name: borgmatic ${{ matrix.borgmatic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # EPEL 9, Debian 13 and the latest release
        borgmatic:
          - '1.8.13'
          - '1.9.14'
          - latest
    env:
      BUNDLE_WITHOUT: release
      BORGMATIC_VALIDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Install borgmatic
        env:
          BORGMATIC_RELEASE: ${{ matrix.borgmatic }}
        run: |
          if [ "$BORGMATIC_RELEASE" = latest ]; then
            pipx install borgmatic
          else
            pipx install "borgmatic==$BORGMATIC_RELEASE"
          fi
      - name: Display borgmatic version
        run: borgmatic --version
      - name: Validate the rendered configurations with borgmatic
        run: |
          bundle exec rake fixtures:prep
          bundle exec rspec spec/defines/config_spec.rb --tag borgmatic --format progress

  tests:
    name: Test suite
    if: always()
    needs:
      - puppet
      - borgmatic
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
